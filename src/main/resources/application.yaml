spring:
  application:
    name: socialmediaApp
  datasource:
    url: jdbc:mysql://localhost:3306/socialmediaApp
    username: root
    password: root
  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true